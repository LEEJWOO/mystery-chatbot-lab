name: Configure Mystery Hub KV and deploy Worker

on:
  push:
    branches: [feature/mystery-integrated-playtest-20261029]
    paths: ['.github/workflows/configure-mystery-hub-kv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystery-scene-lab13-worker-deploy
  cancel-in-progress: false

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab13/package-lock.json
      - name: Locate or create only mystery-hub-saves KV namespace
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/storage/kv/namespaces';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          if(!process.env.CF_ID||!process.env.CF_TOKEN)throw Error('Missing Cloudflare Actions secrets.');
          const ns=[];
          for(let page=1;page<=10;page++){
            const r=await fetch(base+'?per_page=100&page='+page,{headers});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||j.success!==true||!Array.isArray(j.result)){
              console.error('KV namespace listing denied: '+r.status+' '+JSON.stringify(j.errors?.map(x=>x.message)||[]));
              console.error('Cloudflare API token requires account Workers KV Storage:Edit (and Workers Scripts:Edit).');
              process.exit(2);
            }
            ns.push(...j.result);
            if(j.result.length<100)break;
          }
          let selected=ns.find(n=>n.title==='mystery-hub-saves');
          if(!selected){
            const r=await fetch(base,{method:'POST',headers,body:JSON.stringify({title:'mystery-hub-saves'})});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||j.success!==true||!j.result?.id){console.error('KV create failed '+r.status+' '+JSON.stringify(j.errors?.map(x=>x.message)||[]));process.exit(2);}
            selected=j.result;console.log('Created mystery-hub-saves KV namespace.');
          }else console.log('Reusing existing mystery-hub-saves KV namespace.');
          const file='lab13/wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          if(config.name!=='mystery-scene-lab13')throw Error('Wrong worker target.');
          config.workers_dev=true;
          config.kv_namespaces=[{binding:'HUB_SAVES',id:selected.id}];
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          console.log('Configured HUB_SAVES binding for existing Worker.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'KV namespace: mystery-hub-saves\n');
          JS
      - name: Install dependencies and test original Worker
        working-directory: lab13
        run: npm ci && npm test && npm run build
      - name: Test new Mystery Hub
        working-directory: playtest
        run: npm test
      - name: Deploy existing Worker with KV binding
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lab13
          command: deploy --config wrangler.jsonc
      - name: Ensure workers.dev route is enabled
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const u='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/mystery-scene-lab13/subdomain';
          const h={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const r=await fetch(u,{method:'POST',headers:h,body:JSON.stringify({enabled:true,previews_enabled:true})});
          const j=await r.json().catch(()=>({}));
          console.log('workers.dev route',r.status,'enabled:',j.result?.enabled);
          if(!r.ok||j.result?.enabled!==true)throw Error('Failed to enable public worker route: '+JSON.stringify(j.errors?.map(e=>e.message)));
          JS
      - name: Verify public routes and real KV roundtrip
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const base=process.env.URL;
          if(!base?.startsWith('https://'))throw Error('No HTTPS deployment URL');
          async function checked(path,validate){
            let detail='',last=0;
            for(let i=0;i<12;i++){
              try{
                const r=await fetch(base+path,{headers:{'Cache-Control':'no-cache'}});
                const text=await r.text();
                last=r.status;detail=text.slice(0,150);
                if(r.ok&&validate(text,r))return;
              }catch(e){detail=String(e);}
              await new Promise(resolve=>setTimeout(resolve,1500));
            }
            throw Error(path+' failed HTTP '+last+': '+detail);
          }
          await checked('/health',t=>{const j=JSON.parse(t);return j.ok&&j.version===1});
          await checked('/render.svg',t=>t.includes('<svg'));
          await checked('/manifest.json',t=>Array.isArray(JSON.parse(t).assets));
          await checked('/hub/health',t=>{const j=JSON.parse(t);return j.ok&&j.storage==='kv'});
          await checked('/hub/world.json',t=>JSON.parse(t).id==='archive-night-v1');
          await checked('/hub/sprites/curator/front.svg',t=>t.includes('<svg'));
          console.log('Original Worker routes and Hub KV binding verified.');
          const slot='ci-'+randomBytes(8).toString('hex'),token=randomBytes(32).toString('base64url'),url=base+'/hub/state/'+slot;
          const auth={Authorization:'Bearer '+token};
          const saved={protocol:'MYSTERY_HUB_V1',v:1,worldId:'archive-night-v1',rev:7,player:{x:3.5,y:7.5,heading:0},timeSec:32700,flags:{},seen:[],known:[],observed:[],taken:[],selected:null,log:[],appliedReplies:[]};
          const p=await fetch(url,{method:'PUT',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify(saved)});
          const pText=await p.text();
          if(p.status!==200)throw Error('KV PUT '+p.status+': '+pText.slice(0,150));
          const g=await fetch(url,{headers:auth});const gText=await g.text();
          if(g.status!==200||JSON.parse(gText).rev!==7)throw Error('KV GET '+g.status+': '+gText.slice(0,150));
          console.log('Remote KV save/load smoke test passed.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Worker API and KV save/load verified\n'+base+'/hub/world.json\n');
          JS
