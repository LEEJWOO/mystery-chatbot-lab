name: Integrated Mystery Hub checks
on:
  pull_request:
    paths:
      - 'playtest/**'
      - 'lab13/src/worker.mjs'
      - '.github/workflows/playtest-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab13/package-lock.json
      - name: Install playtest dependencies
        working-directory: playtest
        run: npm ci
      - name: Verify generated source, core regressions and JSX
        working-directory: playtest
        run: |
          npm test
          npm run check:jsx
      - name: Install browser
        working-directory: playtest
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        working-directory: playtest
        run: npm run test:browser
      - name: Install existing Lab13 dependencies
        working-directory: lab13
        run: npm ci
      - name: Verify existing Lab13 tests
        working-directory: lab13
        run: npm test
      - name: Bundle shared existing Worker and UUMMAI Lab13
        working-directory: lab13
        run: npm run build

