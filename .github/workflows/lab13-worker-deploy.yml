name: Deploy Lab13 Worker

# Manual deployment only. Never overwrites any existing Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy mystery-scene-lab13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Cloudflare credentials exist
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ID" ] || [ -z "$CF_TOKEN" ]; then
            echo 'Missing Actions secrets: CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab13/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: lab13

      - name: Run deterministic tests
        run: npm test
        working-directory: lab13

      - name: Build UUMMAI JSX, demo, and Worker
        run: npm run build
        working-directory: lab13

      - name: Deploy isolated Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lab13
          command: deploy --config wrangler.jsonc

      - name: Verify Worker endpoints
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo 'Deployment URL not provided by Wrangler. Check Cloudflare dashboard.'
            exit 1
          fi
          echo "Deployment: $WORKER_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$WORKER_URL/health" | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{const j=JSON.parse(d);if(j.ok!==true||j.version!==1)process.exit(1);console.log("health OK")})'
          curl --fail --silent --show-error "$WORKER_URL/manifest.json" | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{const j=JSON.parse(d);if(!Array.isArray(j.assets)||!j.assets.length)process.exit(1);console.log("manifest OK",j.assets.length)})'
          curl --fail --silent --show-error "$WORKER_URL/render.svg" | grep -q '<svg'
          echo "SVG render OK"
          echo "Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: $WORKER_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "Sample SVG: $WORKER_URL/render.svg" >> "$GITHUB_STEP_SUMMARY"
