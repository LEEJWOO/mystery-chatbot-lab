name: Deploy integrated Mystery Hub to existing Worker

on:
  push:
    branches:
      - feature/mystery-integrated-playtest-20261029
    paths:
      - '.github/workflows/deploy-mystery-hub.yml'
      - 'playtest/DEPLOY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystery-scene-lab13-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm worker target and secrets
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          grep -q '"name":"mystery-scene-lab13"' lab13/wrangler.jsonc
          echo "Deploying only existing Worker mystery-scene-lab13; routes /hub/* added."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab13/package-lock.json
      - name: Test new Hub rules and Worker API
        working-directory: playtest
        run: npm test
      - name: Install existing Worker dependencies
        working-directory: lab13
        run: npm ci
      - name: Check original Worker
        working-directory: lab13
        run: npm test
      - name: Bundle existing Worker with /hub routes
        working-directory: lab13
        run: npm run build
      - name: Deploy using existing Wrangler config
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lab13
          command: deploy --config wrangler.jsonc
      - name: Ensure existing Worker has its workers.dev route enabled
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/mystery-scene-lab13/subdomain';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const before=await fetch(url,{headers});
          const info=await before.json().catch(()=>({}));
          console.log('Worker workers.dev route before:',JSON.stringify({status:before.status,enabled:info.result?.enabled,error:info.errors?.map(x=>x.message)}));
          if(info.result?.enabled===true)process.exit(0);
          const response=await fetch(url,{method:'POST',headers,body:JSON.stringify({enabled:true,previews_enabled:true})});
          const answer=await response.json().catch(()=>({}));
          console.log('Enable workers.dev route:',JSON.stringify({status:response.status,enabled:answer.result?.enabled,errors:answer.errors?.map(x=>x.message)}));
          if(!response.ok||answer.success===false||answer.result?.enabled!==true)process.exit(1);
          JS
      - name: Validate existing endpoints and new Hub endpoints
        env:
          URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          echo "Worker: $URL"
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors --retry 3 --retry-delay 2 "$URL/health" | node -e 'let d="";process.stdin.on("data",b=>d+=b).on("end",()=>{const v=JSON.parse(d);if(v.ok!==true||v.version!==1)process.exit(1)})'
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$URL/render.svg" | grep -q '<svg'
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$URL/manifest.json" | node -e 'let d="";process.stdin.on("data",b=>d+=b).on("end",()=>{const v=JSON.parse(d);if(!Array.isArray(v.assets)||!v.assets.length)process.exit(1)})'
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$URL/hub/health" | node -e 'let d="";process.stdin.on("data",b=>d+=b).on("end",()=>{const v=JSON.parse(d);if(!v.ok||v.protocol!=="MYSTERY_HUB_V1")process.exit(1)})'
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$URL/hub/world.json" | node -e 'let d="";process.stdin.on("data",b=>d+=b).on("end",()=>{const v=JSON.parse(d);if(v.id!=="archive-night-v1"||!v.objects?.length)process.exit(1)})'
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$URL/hub/sprites/curator/front.svg" | grep -q '<svg'
          echo "### Existing Worker and Mystery Hub checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/hub/world.json" >> "$GITHUB_STEP_SUMMARY"
