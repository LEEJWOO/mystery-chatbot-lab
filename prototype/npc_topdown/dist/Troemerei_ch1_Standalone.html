uB9BC" }, { "who": "me", "text": "\uD314\uCC0C\uC5D0 \uB0A8\uC740 \uAE30\uB85D\uBD80\uD130 \uBCF4\uC790." }] }, { "type": "rebut", "npc": "mei", "event": "K1_R1", "holdEvent": "K1_R1H", "issue": "i1", "title": "\uBC18\uB860 \xB7 \uD314\uCC0C\uAC00 \uC54C\uB824 \uC900 \uC2DC\uAC01", "guide": "\uBA54\uC774\uBCA8\uC774 \uAE30\uB85D\uC5D0\uC11C \uC77D\uC740 \uC0AC\uC2E4\uACFC, \uADDC\uCE59\uC744 \uBCF4\uACE0 \uC9D0\uC791\uD55C \uC77C\uC744 \uC9DA\uC5B4 \uBCF4\uC790", "goal": "'\uD314\uCC0C \uD574\uC81C'\uC640 '\uC2E4\uC81C \uCC98\uD615 \uC9D1\uD589'\uC740 \uBCC4\uAC1C\uB77C\uB294 \uB73B\uC774\uBA74 \uD1B5\uACFC. \uD2B9\uC815 \uC2DC\uAC01\xB7\uC0AC\uC778\xB7\uBC14\uB8EC\uC758 \uC774\uB984\uC740 \uC694\uAD6C\uD558\uC9C0 \uC54A\uB294\uB2E4. '\uC2ED \uBD84 \uB4A4\uC796\uC544'\uCC98\uB7FC \uACC4\uC0B0\uB9CC \uB9D0\uD558\uBA74 \uBD80\uC871.", "lines": [{ "who": "mei", "text": "{\uD314\uCC0C\uAC00 \uD480\uB9B0 \uC2DC\uAC01\uC740} {\uC5EC\uC12F \uC2DC \uC0AC\uC2ED \uBD84}. \uC774\uAC74 \uC6B0\uB9AC \uBAA8\uB450 \uAC19\uC740 \uAE30\uB85D\uC744 \uBCF4\uACE0 \uC788\uC9C0\uC694?", "face": "\uAE30\uBCF8" }, { "who": "mei", "text": "{\uB2E4\uC2DC \uCC28\uC9C0 \uC54A\uC73C\uBA74} {\uC2ED \uBD84 \uB4A4\uC5D0 \uCC98\uD615}\uC774\uC5D0\uC694. {\uC9C0\uBC30\uC778\uC774 \uC6B0\uB9AC\uC5D0\uAC8C \uC9C1\uC811 \uC77D\uC5B4 \uC900 \uADDC\uCE59}\uC774\uB78D\uB2C8\uB2E4.", "face": "\uC9C4\uC9C0" }, { "who": "mei", "text": "\uADF8\uB7EC\uB2C8 {\uC800\uC2A4\uD2F4\uC774 \uC5EC\uC12F \uC2DC \uC624\uC2ED \uBD84\uC5D0 \uCC98\uD615\uB410\uB2E4\uB294 \uAC83\uAE4C\uC9C0}, {\uC774 \uAE30\uB85D\uC73C\uB85C \uD655\uC778\uB41C \uC148}\uC774\uC5D0\uC694.", "face": "\uC758\uAE30\uC591\uC591" }], "answers": [{ "at": [2, 0], "ev": ["band_log"] }, { "at": [2, 1], "ev": ["band_log"] }], "miss": { "mei": { "text": "\uC5B4\uB290 \uB300\uBAA9\uC774 \uADF8 \uC99D\uAC70\uC640 \uC5B4\uAE0B\uB09C\uB2E4\uB294 \uAC70\uC8E0?", "face": "\uC758\uC2EC" } }, "mono": ["\uAC19\uC740 \uAE30\uB85D\uC744 \uC77D\uC5C8\uB294\uB370, \uBA54\uC774\uBCA8\uC740 \uAC70\uAE30\uC11C \uC5B4\uB514\uAE4C\uC9C0 \uC54C\uC544\uB0C8\uB2E4\uB294 \uAC70\uC9C0?", "\uAE30\uB85D\uC5D0 \uC801\uD78C \uAC83\uACFC, \uBA54\uC774\uBCA8\uC774 \uB367\uBD99\uC778 \uAC83. \uADF8 \uACBD\uACC4\uAC00 \uC5B4\uB514\uC9C0?", "\u2026\u2026\uC138 \uBB38\uC7A5 \uC911 \uD558\uB098\uB294 \uAE30\uB85D\uC774 \uC544\uB2C8\uB77C \uC9D0\uC791\uC774\uC57C."], "monoRb": ["\uC2DC\uAC01 \uACC4\uC0B0\uC5D0\uB294 \uC774\uACAC\uC774 \uC5C6\uC5B4. \uD655\uC778\uD574\uC57C \uD558\uB294 \uAC74 \uADF8 \uC2DC\uAC01\uC5D0 \uBB34\uC2A8 \uC77C\uC774 \uC788\uC5C8\uB290\uB0D0\uC57C.", "\uAE30\uD55C\uC744 \uC548\uB2E4\uACE0 \uD574\uC11C, \uADF8 \uAE30\uD55C\uC5D0 \uBB34\uC2A8 \uC77C\uC774 \uC77C\uC5B4\uB0AC\uB294\uC9C0\uAE4C\uC9C0 \uC544\uB294 \uAC74 \uC544\uB2C8\uC57C.", "\uD314\uCC0C\uAC00 \uC54C\uB824 \uC900 \uAC74 \uD558\uB098\uBFD0\uC774\uC57C. \uB098\uBA38\uC9C0\uB294 \uB204\uAD6C\uC5D0\uAC8C \uBB3C\uC5B4\uC57C \uD558\uC9C0?"] }, { "type": "talk", "issue": "i1", "lines": [{ "who": "me", "text": "\uC9C0\uBC30\uC778. \uC5F4\uC5EC\uB35F \uC2DC \uC624\uC2ED \uBD84\uC5D0, \uC800\uC2A4\uD2F4\uC5D0 \uB300\uD55C \uD574\uC81C \uBC8C\uCE59\uC744 \uC9D1\uD589\uD588\uC5B4?" }, { "who": "host", "text": "\uC9D1\uD589\uD558\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4.", "fx": "flash" }, { "who": "mei", "text": "\u2026\u2026\uADF8, \uADF8\uB7FC \uC800\uC2A4\uD2F4\uC740\u2026\u2026.", "face": "\uB2F9\uD669", "alt": [{ "if": { "rel": { "trust": [4, 5] } }, "text": "\u2026\u2026\uB2F9\uC2E0 \uB9D0\uC774 \uB9DE\uC558\uB124. \uC544, \uC544\uB2C8, \uB9DE\uC558\uB2F5\uB2C8\uB2E4.", "face": "\uB2F9\uD669" }] }, { "who": "ruoxi", "text": "\uBB3C\uC744 \uB9C8\uC2E0 \uD754\uC801\uACFC \uB0AE\uC740 \uCCB4\uC628. \uC775\uC0AC\uC640 \uC800\uCCB4\uC628 \uC18C\uACAC\uC785\uB2C8\uB2E4. \uBC8C\uCE59\uBCF4\uB2E4 \uBA3C\uC800\uC600\uC2B5\uB2C8\uB2E4.", "face": "\uC9C4\uC9C0" }, { "who": "killian", "text": "\uD314\uCC0C\uB97C \uD480\uACE0 \uC2ED \uBD84\uC774 \uC9C0\uB098\uAE30 \uC804\uC5D0\u2026\u2026. \uADF8 \uBC14\uC704\uD2C8\uC5D0\uC11C\uC694.", "face": "\uC2AC\uD514" }] }, { "type": "trans", "issue": "i2", "text": "\uC7C1\uC810 \uB458" }, { "type": "talk", "issue": "i2", "lines": [{ "who": "me", "text": "\uD314\uCC0C\uC5D0\uC11C \uD55C \uAC00\uC9C0\uB9CC \uB354 \uBCF4\uC790. \uB450 \uBC88 \uAC08\uC544 \uB07C\uC6E0\uC73C\uBA74 \uC5EC\uC12F \uAC1C\uAC00 \uB0A8\uC544. \uADF8\uB7F0\uB370 \uC6B0\uB9AC\uAC00 \uC13C \uAC74 \uB2E4\uC12F \uAC1C\uC57C. \uC800\uC2A4\uD2F4\uC774 \uC804\uC9C0 \uD558\uB098\uB97C \uB530\uB85C \uB454 \uAC78 \uBCF8 \uC0AC\uB78C \uC788\uC5B4?" }, { "who": "clara", "text": "\uB193\uB294 \uBAA8\uC2B5\uC740 \uBCF4\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4. \uC800\uC2A4\uD2F4 \uC528\uAC00 \uC81C\uAC8C \uD55C \uB9D0\uC740 \uAE30\uC5B5\uD569\uB2C8\uB2E4. \u2018\uD5E4\uC774, \uC55E\uB9C8\uB2F9\uC5D0\uC11C \uC62C\uB824\uB2E4\uBD10. \uC678\uBCBD \uCC98\uB9C8\uC5D0 \uC608\uBE44 \uC804\uC9C0\uAC00 \uC788\uC5B4.\u2019", "face": "\uC9C4\uC9C0" }, { "who": "karim", "text": "\uD074\uB77C\uB77C\uAC00 \uC800\uC2A4\uD2F4\uD558\uACE0 \uC598\uAE30\uD55C \uAC74 \uC5EC\uB35F \uC2DC \uBC18\uCBE4\uC774\uC57C. \uB85C\uBE44\uC5D0\uC11C \uB0B4\uAC00 \uAE30\uB2E4\uB838\uAC70\uB4E0.", "face": "\uAE30\uBCF8" }, { "who": "killian", "text": "\uC7A0\uAE50\uB9CC\uC694, \uD074\uB77C\uB77C \uC528. \uC800\uB3C4 \uB85C\uBE44\uC5D0\uC11C \uB4E4\uC5C8\uC5B4\uC694. \uADF8\uB7F0\uB370 \uC81C\uAC8C\uB294 \uC640\uC778 \uC800\uC7A5\uACE0\uB85C \uAC00 \uBCF4\uB77C\uACE0 \uD588\uC5B4\uC694. \uD5D0\uAC70\uC6B4 \uBCBD\uB3CC \uB4A4\uC5D0 \uC788\uB2E4\uACE0\uC694.", "face": "\uACE4\uB780" }, { "who": "odile", "text": "\uD0AC\uB9AC\uC5B8\uC774 \uB3CC\uC544\uC654\uC744 \uB550 \uC5EC\uB35F \uC2DC \uC624\uC2ED\uC624 \uBD84\uC744 \uC880 \uB118\uACBC\uC5B4. \uB458\uC774 \uC598\uAE30\uD558\uB294 \uAC74 \uBD24\uB294\uB370, \uBCBD\uB3CC \uC598\uAE34 \uB098\uB3C4 \uC9C0\uAE08 \uCC98\uC74C \uB4E4\uC5B4.", "face": "\uC758\uC2EC" }, { "who": "clara", "text": "\uD0AC\uB9AC\uC5B8 \uC528, \uD55C \uAC00\uC9C0\uB9CC \uD655\uC778\uD558\uACA0\uC2B5\uB2C8\uB2E4. \uADF8 \uB9D0\uC744 \uB4E4\uC73C\uC2E4 \uB54C \uC81C\uAC00 \uACC1\uC5D0 \uC788\uC5C8\uC2B5\uB2C8\uAE4C?", "face": "\uAE30\uBCF8" }, { "who": "me", "text": "(\uB450 \uC0AC\uB78C \uB2E4 \uB85C\uBE44\uB77C\uACE0 \uD588\uB2E4. \uADF8\uB7F0\uB370 \uD55C \uC0AC\uB78C\uC740 \uC704\uB97C \uBCF4\uB77C\uACE0 \uD588\uACE0, \uD55C \uC0AC\uB78C\uC740 \uBCBD\uB3CC \uB4A4\uB97C \uBCF4\uB77C\uACE0 \uD588\uB2E4. \uC5B4\uB514\uAC00 \uC5B4\uAE0B\uB09C \uAC70\uC9C0?)" }] }, { "type": "choice", "issue": "i2", "title": "\uC5C7\uAC08\uB9B0 \uC99D\uC5B8", "guide": "\uB450 \uC9C4\uC220\uC5D0\uC11C \uC11C\uB85C \uB2E4\uB978 \uBD80\uBD84\uC744 \uACE0\uB978\uB2E4", "show": [{ "who": "clara", "text": "\uB85C\uBE44\uC5D0\uC11C, \uC800\uC2A4\uD2F4 \uC528\uAC00 \u2014 \uC678\uBCBD \uCC98\uB9C8\uC5D0 \uC608\uBE44 \uC804\uC9C0\uAC00 \uC788\uB2E4\uACE0." }, { "who": "killian", "text": "\uB85C\uBE44\uC5D0\uC11C, \uC800\uC2A4\uD2F4 \uC528\uAC00 \u2014 \uC640\uC778 \uC800\uC7A5\uACE0 \uD5D0\uAC70\uC6B4 \uBCBD\uB3CC \uB4A4\uB77C\uACE0." }], "question": "\uB450 \uC0AC\uB78C\uC758 \uB9D0\uC5D0\uC11C \uC5B4\uAE0B\uB098\uB294 \uAC74?", "options": [{ "t": "\uC800\uC2A4\uD2F4\uC744 \uB9CC\uB09C \uC7A5\uC18C", "miss": { "who": "odile", "text": "\uB098\uB3C4 \uCE74\uB9BC\uB3C4 \uB85C\uBE44\uC5D0\uC11C \uAE30\uB2E4\uB838\uC5B4. \uADF8 \uBD80\uBD84\uC740 \uB9DE\uC796\uC544?", "face": "\uC758\uC2EC" } }, { "t": "\uC804\uC9C0\uAC00 \uC788\uB2E4\uACE0 \uB4E4\uC740 \uC7A5\uC18C", "ok": true }, { "t": "\uB9D0\uC744 \uAC74 \uC0AC\uB78C", "miss": { "who": "killian", "text": "\uBCBD\uB3CC \uC598\uAE30\uB97C \uAEBC\uB0B8 \uBD84\uC740 \uC800\uC2A4\uD2F4 \uC528\uC608\uC694. \uD074\uB77C\uB77C \uC528\uB3C4 \uADF8\uBD84\uACFC \uC598\uAE30\uD558\uC168\uACE0\uC694.", "face": "\uACE4\uB780" } }] }, { "type": "talk", "issue": "i2", "lines": [{ "who": "me", "text": "\uB458 \uB2E4 \uB9DE\uC744 \uC218 \uC788\uC5B4. \uC800\uC2A4\uD2F4\uC774 \uAC19\uC740 \uB85C\uBE44\uC5D0\uC11C, \uC0AC\uB78C\uC744 \uBC14\uAFD4 \uAC00\uBA70 \uB2E4\uB978 \uC7A5\uC18C\uB97C \uB9D0\uD588\uC73C\uBA74." }, { "who": "me", "text": "(\uC2E4\uC81C\uB85C \uBCBD\uB3CC \uB4A4\uB97C \uD655\uC778\uD588\uB2E4\uBA74 \uB9D0\uD560 \uC218 \uC788\uB294\uB370\u2026\u2026.)", "alt": [{ "if": { "item": "spare_wine" }, "text": "\uBCBD\uB3CC \uB4A4\uC5D0 \uC2E4\uC81C\uB85C \uD558\uB098 \uC788\uC5C8\uC5B4. \uB0B4\uAC00 \uAEBC\uB0C8\uC5B4." }] }, { "who": "killian", "text": "\uC81C\uAC00 \uC9C1\uC811 \uD655\uC778\uD55C \uAC74 \uC5C6\uC5B4\uC694. \uC800\uC2A4\uD2F4 \uC528\uC5D0\uAC8C \uB4E4\uC740 \uC790\uB9AC\uB9CC \uB9D0\uC500\uB4DC\uB9B4 \uC218 \uC788\uC5B4\uC694.", "face": "\uACE4\uB780", "alt": [{ "if": { "item": "spare_wine" }, "text": "\u2026\u2026\uC815\uB9D0 \uC788\uC5C8\uAD70\uC694. \uC800\uC2A4\uD2F4 \uC528\uAC00 \uD55C \uB9D0\uC774.", "face": "\uB180\uB78C" }] }, { "who": "freddie", "text": "\u2018\uB0B4\uAC00 \uD55C \uBC88 \uB354 \uD655\uC778\uD560 \uB54C\uAE4C\uC9C4 \uC6B0\uB9AC\uB07C\uB9AC\uB9CC \uC54C\uACE0 \uC788\uC790.\u2019 \uB098\uD55C\uD14C\uB3C4 \uADF8\uB7AC\uC5B4. \uC815\uC6D0\uC5D0\uC11C. \uB0B4 \uCABD\uC740 \uB9AC\uB128\uC2E4 \uC120\uBC18 \uB4A4\uC600\uACE0.", "face": "\uAE30\uBCF8" }, { "who": "mei", "text": "\uC544\uD649 \uC2DC \uC2ED\uC624 \uBD84\uC774\uC5C8\uC5B4\uC694. \uC81C\uAC00 \uC815\uC6D0\uC5D0\uC11C \uAE30\uB2E4\uB9B0 \uC2DC\uAC01\uC774\uB2C8 \uAE30\uC5B5\uD55C\uB2F5\uB2C8\uB2E4. \uC120\uBC18 \uC774\uC57C\uAE30\uB294 \uC81C \uADC0\uAE4C\uC9C0 \uB4E4\uB9AC\uC9C0 \uC54A\uC558\uC5B4\uC694.", "face": "\uC9C4\uC9C0" }, { "who": "suzune", "text": "\uC800\uB294 \uC804\uB9DD \uBC14\uC704 \uC704\uB77C\uACE0 \uB4E4\uC5C8\uC5B4\uC694. \u2026\uADF8\uB7F0\uB370 \uC800\uB294 \uD63C\uC790\uB9CC \uC54C\uACE0 \uC788\uC9C4 \uC54A\uC558\uC5B4\uC694. \uB85C\uBE44\uC5D0\uC11C \uB098\uC624\uACE0 \uB098\uC11C \uBC14\uB8EC \uC528\uD55C\uD14C \uB9D0\uD588\uC5B4\uC694.", "face": "\uACE4\uB780" }, { "who": "varun", "text": "\uC544\uD649 \uC2DC \uC0AC\uC2ED \uBD84\uC5D0 \uB458\uC774 \uC598\uAE30\uD588\uB2E4. \uB09C \uADF8 \uB4A4\uC5D0 \uB4E4\uC5C8\uC9C0. \uC2A4\uC988\uB124\uD55C\uD14C.", "face": "\uAE30\uBCF8" }, { "who": "seoha", "text": "\uB0B4 \uCABD\uC740 \uB2E4\uC774\uBE59\uB300 \uAF2D\uB300\uAE30. \uB450 \uC0AC\uB78C \uC55E\uC5D0\uC11C \uAC19\uC740 \uB9D0\uC744 \uD55C \uACBD\uC6B0\uAC00 \uD558\uB098\uB77C\uB3C4 \uC788\uC5C8\uC5B4?", "face": "\uC9C4\uC9C0" }, { "who": "ruoxi", "text": "\uC5F4 \uC2DC \uC624 \uBD84, 2\uCE35 \uD734\uAC8C \uCF54\uB108\uC600\uC2B5\uB2C8\uB2E4. \uB450 \uC0AC\uB78C\uC774 \uBCF4\uC600\uC2B5\uB2C8\uB2E4. \uB9D0\uC18C\uB9AC\uB294 \uB4E4\uB9AC\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4.", "face": "\uAE30\uBCF8" }] }, { "type": "table", "issue": "i2", "title": "\uBA74\uB2F4\uD45C \uCC44\uC6B0\uAE30", "guide": "\uD30C\uD2B8\uB108\uAC00 \uBCF8 \uC2DC\uAC01\uACFC, \uB4E4\uC740 \uC0AC\uB78C\uC774 \uB9D0\uD55C \uC790\uB9AC\uB97C \uD55C \uC904\uC529 \uB9DE\uCD98\uB2E4", "cols": ["\uC2DC\uAC01", "\uBCF8 \uC0AC\uB78C", "\uB4E4\uC740 \uC0AC\uB78C", "\uB4E4\uC740 \uC790\uB9AC"], "rows": [[{ "v": "08:30" }, { "v": "\uCE74\uB9BC" }, { "a": "\uD074\uB77C\uB77C", "ask": true }, { "a": "\uC678\uBCBD \uCC98\uB9C8", "ask": true }], [{ "v": "08:55" }, { "v": "\uC624\uB51C" }, { "a": "\uD0AC\uB9AC\uC5B8", "ask": true }, { "a": "\uC640\uC778 \uC800\uC7A5\uACE0 \uBCBD\uB3CC \uB4A4", "ask": true }], [{ "v": "09:15" }, { "v": "\uBA54\uC774\uBCA8" }, { "a": "\uD504\uB808\uB514", "ask": true }, { "a": "\uB9AC\uB128\uC2E4 \uC120\uBC18 \uB4A4", "ask": true }], [{ "v": "09:40" }, { "v": "\uBC14\uB8EC" }, { "a": "\uC2A4\uC988\uB124", "ask": true }, { "a": "\uC804\uB9DD \uBC14\uC704 \uC704", "ask": true }], [{ "v": "10:05" }, { "v": "\uB8E8\uC624\uC2DC" }, { "a": "\uC11C\uD558", "ask": true }, { "a": "\uB2E4\uC774\uBE59\uB300 \uAF2D\uB300\uAE30", "ask": true }]], "opts": { "2": ["\uD074\uB77C\uB77C", "\uD0AC\uB9AC\uC5B8", "\uD504\uB808\uB514", "\uC2A4\uC988\uB124", "\uC11C\uD558", "\uCE74\uB9BC", "\uC624\uB51C"], "3": ["\uC678\uBCBD \uCC98\uB9C8", "\uC640\uC778 \uC800\uC7A5\uACE0 \uBCBD\uB3CC \uB4A4", "\uB9AC\uB128\uC2E4 \uC120\uBC18 \uB4A4", "\uC804\uB9DD \uBC14\uC704 \uC704", "\uB2E4\uC774\uBE59\uB300 \uAF2D\uB300\uAE30", "\uC625\uC0C1 \uBB3C\uD0F1\uD06C"] } }, { "type": "talk", "issue": "i2", "lines": [{ "who": "me", "text": "\uB2E4\uC12F \uC0AC\uB78C, \uB2E4\uC12F \uC790\uB9AC. \uACB9\uCE58\uB294 \uACF3\uC774 \uD558\uB098\uB3C4 \uC5C6\uC5B4." }, { "who": "me", "text": "\uC9C4\uC5F4\uC7A5\uC5D0\uC11C \uC0AC\uB77C\uC9C4 \uAC74 \uB124 \uAC1C\uC778\uB370, \uC800\uC2A4\uD2F4\uC774 \uC54C\uB824 \uC900 \uC790\uB9AC\uB294 \uC65C \uB2E4\uC12F\uC774\uC9C0?" }] }, { "type": "trans", "issue": "i3", "text": "\uC7C1\uC810 \uC14B" }, { "type": "talk", "issue": "i3", "lines": [{ "who": "mei", "text": "\uD55C \uACF3\uCBE4 \uBE44\uC5B4 \uC788\uC5C8\uC744 \uC218\uB3C4 \uC788\uC796\uC544\uC694. \uC544\uC9C1 \uC13C \uAC74 \uC7A5\uC18C\uBFD0\uC774\uB78D\uB2C8\uB2E4. \uC804\uC9C0\uB3C4 \uB2E4\uC12F \uAC1C\uC600\uB2E4\uACE0 \uB204\uAC00 \uBCF4\uC99D\uD558\uC8E0?", "face": "\uC758\uC2EC" }, { "who": "me", "text": "\uC751. \uADF8 \uD45C\uB9CC \uB4E4\uC5EC\uB2E4\uBD10\uC120 \uBAA8\uB974\uACA0\uC5B4. \uC800\uC2A4\uD2F4\uC774 \uAC00\uC9C0\uACE0 \uC788\uB358 \uCABD\uC744 \uC138 \uBCF4\uC790." }, { "who": "karim", "text": "\uCC98\uC74C \uBC1B\uC740 \uAC74 \uB098\uB791 \uAC19\uC544. \uC190\uBAA9\uC5D0 \uD558\uB098, \uC8FC\uBA38\uB2C8\uC5D0 \uC77C\uACF1.", "face": "\uC9C4\uC9C0" }] }, { "type": "choice", "issue": "i3", "num": true, "title": "\uC22B\uC790 \uACE0\uB974\uAE30", "guide": "\uD314\uCC0C \uAE30\uB85D\uACFC \uD604\uBB3C\uC744 \uB9DE\uB300 \uBCF8\uB2E4", "show": [{ "who": "me", "text": "\uAE30\uB85D: 06:00 \uAD50\uCCB4 \xB7 18:00 \uAD50\uCCB4 \xB7 18:40 \uD574\uC81C \uAC10\uC9C0. \uD604\uBB3C: \uC7A5\uCC29 1\uAC1C \xB7 \uC608\uBE44 4\uAC1C." }], "question": "\uB450 \uBC88\uC9F8 \uAD50\uCCB4\uAC00 \uB05D\uB0AC\uC744 \uB54C, \uC800\uC2A4\uD2F4\uC758 \uC8FC\uBA38\uB2C8\uC5D0\uB294 \uC608\uBE44 \uC804\uC9C0\uAC00 \uBA87 \uAC1C \uC788\uC5B4\uC57C \uD558\uC9C0?", "options": [{ "t": "4\uAC1C", "miss": { "who": "me", "text": "(\uB137\uC740 \uD314\uCC0C \uC606\uC5D0\uC11C \uC2E4\uC81C\uB85C \uC13C \uC218\uC57C. \uACC4\uC0B0\uC73C\uB85C \uB098\uC640\uC57C \uD560 \uC218\uB294?)" } }, { "t": "5\uAC1C", "ok": true }, { "t": "6\uAC1C", "miss": { "who": "me", "text": "(\uC5EC\uC12F\uC740 \uC190\uBAA9\uC5D0 \uCC2C \uAC83\uAE4C\uC9C0 \uC13C \uC218\uC57C. \uC9C0\uAE08 \uBE44\uAD50\uD560 \uAC74 \uC8FC\uBA38\uB2C8 \uCABD\uC774\uC57C.)" } }, { "t": "7\uAC1C", "miss": { "who": "karim", "text": "\uC77C\uACF1\uC740 \uCC98\uC74C \uBC1B\uC558\uC744 \uB54C \uC598\uAE30\uC57C. \uB450 \uBC88 \uAC08\uC544 \uB07C\uC6E0\uC796\uC544.", "face": "\uACE4\uB780" } }] }, { "type": "talk", "issue": "i3", "lines": [{ "who": "me", "text": "\uC77C\uACF1 \uAC1C \uC911\uC5D0 \uC544\uCE68\uC5D0 \uD558\uB098, \uC800\uB141\uC5D0 \uD558\uB098\uB97C \uAEBC\uB0C8\uC5B4. \uADF8\uB7EC\uBA74 \uC8FC\uBA38\uB2C8\uC5D0 \uB2E4\uC12F \uAC1C\uAC00 \uB0A8\uC544\uC57C \uD574. \uADF8\uB7F0\uB370 \uD314\uCC0C \uC606\uC5D0 \uC788\uB358 \uC608\uBE44\uB294 \uB124 \uAC1C\uC600\uC5B4." }, { "who": "seoha", "text": "\uB07C\uC6CC\uC9C4 \uAC83\uAE4C\uC9C0 \uC138\uBA74 \uC5EC\uC12F\uC774\uC5B4\uC57C \uD558\uB294\uB370 \uB2E4\uC12F. \uC5B4\uB290 \uCABD\uC73C\uB85C \uC138\uB3C4 \uD558\uB098\uAC00 \uBE44\uB124.", "face": "\uC9C4\uC9C0" }, { "who": "mei", "text": "\uADF8\uB798\uB3C4\u2026\u2026 \uBB3C\uAC00\uC5D0\uC11C \uD55C \uAC1C\uB97C \uB193\uCCE4\uB2E4\uBA74\uC694? \uADF8\uAC8C \uAF2D \uC800\uC2A4\uD2F4\uC774 \uC228\uAE34 \uC804\uC9C0\uB77C\uB294 \uBC95\uC740 \uC5C6\uC5B4\uC694.", "face": "\uACE4\uB780" }, { "who": "me", "text": "\uB9DE\uC544. \uBC14\uB2F7\uAC00\uC5D0\uC11C \uC13C \uAC83\uB9CC\uC73C\uB860 \uBAB0\uB77C. \uADF8\uB798\uC11C \uC544\uCE68\uC5D0 \uC800\uC2A4\uD2F4\uC774 \uD55C \uB9D0\uC744 \uB2E4\uC2DC \uBCF4\uACE0 \uC2F6\uC5B4." }, { "who": "freddie", "text": "\u2018\uB0B4\uAC00 \uD55C \uBC88 \uB354 \uD655\uC778\uD560 \uB54C\uAE4C\uC9C4.\u2019 \u2026\u2026\uC7A0\uAE50. \uB098\uB354\uB7EC \uD655\uC778\uD574 \uBCF4\uB780 \uC18C\uB9AC\uB294 \uC5C6\uC5C8\uC5B4. \uADF8\uB7FC \uD655\uC778\uD558\uB7EC \uAC08 \uC0AC\uB78C\uC740 \uC800\uC2A4\uD2F4\uC774\uC796\uC544.", "face": "\uAE30\uBCF8" }, { "who": "killian", "text": "\uC21C\uC11C\uB300\uB85C \uC0DD\uAC01\uD574 \uBD10\uC694. \uC800\uC7A5\uACE0\uC758 \uC804\uC9C0\uAC00 \uC5C6\uC5B4\uC9C0\uBA74 \uC800\uC2A4\uD2F4 \uC528\uB294 \uB204\uAD6C\uBD80\uD130 \uCC3E\uC544\uAC08\uAE4C\uC694? \uADF8 \uB9D0\uC744 \uC9C1\uC811 \uB4E4\uC740 \uC800\uACA0\uC8E0.", "face": "\uC9C4\uC9C0" }, { "who": "suzune", "text": "\uD558\uC9C0\uB9CC \uC800\uB294 \uBC14\uB8EC \uC528\uD55C\uD14C\uB3C4 \uB9D0\uD588\uC5B4\uC694.", "face": "\uACE4\uB780" }, { "who": "killian", "text": "\u2026\u2026\uADF8\uB807\uAD70\uC694, \uC2A4\uC988\uB124 \uC528. \uC800\uC2A4\uD2F4 \uC528\uB294 \uC6B0\uB9AC \uC911 \uB204\uAC00 \uADF8 \uB9D0\uC744 \uB610 \uC804\uD588\uB294\uC9C0\uAE4C\uC9C0\uB294 \uBAB0\uB790\uACA0\uC5B4\uC694.", "face": "\uACE4\uB780" }] }, { "type": "rebut", "npc": "mei", "event": "K1_R2", "holdEvent": "K1_R2H", "issue": "i3", "title": "\uBC18\uB860 \xB7 \uB2E4\uC12F \uBC88\uC9F8 \uC804\uC9C0", "guide": "\uBAA8\uC790\uB77C\uB294 \uD55C \uAC1C\uB294 \uC5B4\uB514\uC11C \uB098\uC654\uACE0, \uC65C \uB2E4\uC12F \uAD70\uB370\uC600\uC744\uAE4C", "goal": '\uC9C4\uC5F4\uC7A5\uC758 \uB124 \uAC1C\uC5D0 \uC800\uC2A4\uD2F4\uC774 \uC790\uAE30 \uC608\uBE44 \uC804\uC9C0 \uD558\uB098\uB97C \uBCF4\uD0DC \uB2E4\uC12F \uACF3\uC5D0 \uB193\uC558\uACE0, \uADF8 \uC815\uBCF4\uB97C \uB4E4\uC740 \uC0AC\uB78C\uC774 \uC6C0\uC9C1\uC774\uB294\uC9C0(\uC804\uC9C0\uAC00 \uC0AC\uB77C\uC9C0\uB294\uC9C0) \uBCF4\uB824\uB294 \uBBF8\uB07C\uC600\uB2E4\uB294 \uB73B\uC774\uBA74 \uD1B5\uACFC. "\uC790\uAE30 \uAC83 \uD558\uB098"\uAE4C\uC9C0\uB9CC \uB9D0\uD558\uBA74 \uBD80\uC871(\uC6A9\uB3C4\uAC00 \uBE60\uC9D0).', "lines": [{ "who": "mei", "text": "\uC9C4\uC5F4\uC7A5\uC5D0\uC11C \uC5C6\uC5B4\uC9C4 \uAC74 {\uB124 \uAC1C}\uC600\uC5B4\uC694. \uADF8\uAC74 \uBAA8\uB450 \uC544\uB294 \uC0AC\uC2E4\uC774\uB78D\uB2C8\uB2E4.", "face": "\uAE30\uBCF8" }, { "who": "mei", "text": "{\uB124 \uAC1C\uB85C} {\uB2E4\uC12F \uAD70\uB370}\uB97C \uCC44\uC6B8 \uC218\uB294 \uC5C6\uC796\uC544\uC694?", "face": "\uC758\uC2EC" }, { "who": "mei", "text": "\uADF8\uB7EC\uB2C8 {\uD55C \uACF3\uC740 \uCC98\uC74C\uBD80\uD130 \uBE44\uC5B4 \uC788\uC5C8\uB358} \uAC70\uC608\uC694. {\uC800\uC2A4\uD2F4\uC774 \uD5C8\uD48D\uC744 \uCE5C} \uAC70\uB78D\uB2C8\uB2E4, \uC624\uD638\uD638.", "face": "\uC758\uAE30\uC591\uC591" }], "answers": [{ "at": [2, 0], "ev": ["justin_band", "band_log"] }, { "at": [2, 1], "ev": ["justin_band", "band_log"] }], "miss": { "mei": { "text": "\uADF8 \uC99D\uAC70\uB85C \uBB34\uC5C7\uC774 \uD2C0\uB838\uB2E4\uB294 \uAC70\uC8E0? \uB9D0\uC500\uD574 \uBCF4\uC2DC\uB78D\uB2C8\uB2E4.", "face": "\uC758\uC2EC" } }, "mono": ["\uC800\uC2A4\uD2F4\uC758 \uC8FC\uBA38\uB2C8\uC5D0\uC11C \uBAA8\uC790\uB790\uB358 \uD558\uB098\uB97C \uB5A0\uC62C\uB824.", "\uB124 \uAC1C\uC640 \uB2E4\uC12F \uAD70\uB370. \uC22B\uC790 \uD558\uB098\uAC00 \uC5B4\uB514\uC11C \uC654\uC9C0?", "\uD5C8\uD48D\uC774 \uC544\uB2C8\uB77C\uBA74, \uADF8 \uD558\uB098\uB294 \uB204\uAD6C \uAC70\uC600\uC744\uAE4C."], "monoRb": ["\uD558\uB098\uB97C \uC5B4\uB514\uC11C \uB9C8\uB828\uD588\uB294\uC9C0\uB294 \uB9DE\uD614\uC5B4. \uADF8\uB7F0\uB370 \uC65C \uB2E4\uC12F \uAD70\uB370\uC600\uB294\uC9C0\uAC00 \uBE60\uC84C\uC5B4.", "\uB2E4\uC12F \uC0AC\uB78C\uC5D0\uAC8C \uB2E4\uB978 \uC790\uB9AC\uB97C \uB9D0\uD55C \uC774\uC720 \u2014 \uC804\uC9C0\uAC00 \uC0AC\uB77C\uC9C0\uBA74 \uBB34\uC5C7\uC744 \uC54C \uC218 \uC788\uC9C0?", '\uC800\uC2A4\uD2F4\uC740 "\uAC00\uC838\uC640"\uAC00 \uC544\uB2C8\uB77C "\uB0B4\uAC00 \uD655\uC778\uD560 \uB54C\uAE4C\uC9C0"\uB77C\uACE0 \uD588\uC5B4.'] }, { "type": "talk", "issue": "i3", "lines": [{ "who": "me", "text": "\uC9C4\uC5F4\uC7A5\uC5D0\uC11C \uAC00\uC838\uC628 \uB124 \uAC1C\uB85C\uB294 \uC6B0\uB9AC \uB2E4\uC12F \uC870\uC5D0 \uD558\uB098\uC529 \uB193\uC744 \uC218 \uC5C6\uC5B4. \uC800\uC2A4\uD2F4\uD55C\uD14C\uB294 \uC790\uAE30 \uC608\uBE44\uAC00 \uC788\uC5C8\uACE0, \uB531 \uD558\uB098\uAC00 \uBAA8\uC790\uB77C. \uADF8 \uD558\uB098\uAE4C\uC9C0 \uAEBC\uB0B4\uC11C \uB2E4\uC12F \uAD70\uB370\uC5D0 \uB193\uC740 \uAC70\uC57C." }, { "who": "mei", "text": "\uADF8\uB7FC \uB204\uAC00 \uC9D1\uC5B4 \uAC00\uAE38 \uAE30\uB2E4\uB838\uB2E4\uB294 \uAC70\uC608\uC694? \uC790\uAE30\uB3C4 \uC5F4\uB450 \uC2DC\uAC04\uC740 \uB354 \uC4F8 \uC218 \uC788\uB294 \uAC78 \uAC70\uAE30 \uB450\uACE0?", "face": "\uC9C4\uC9C0" }, { "who": "me", "text": "\uC751. \uC804\uC9C0\uAC00 \uC0AC\uB77C\uC9C4 \uC790\uB9AC\uB97C \uBCF4\uBA74, \uC790\uAE30\uAC00 \uB204\uAD6C\uD55C\uD14C \uD758\uB9B0 \uC598\uAE30\uAC00 \uC0AC\uB78C\uC744 \uC6C0\uC9C1\uC600\uB294\uC9C0 \uC54C \uC218 \uC788\uC73C\uB2C8\uAE4C. \u2018\uBC94\uC778\uC744 \uCC3E\uC790\u2019\uACE0 \uD588\uC744 \uB54C\uB294 \uC774\uBBF8 \uBBF8\uB07C\uB97C \uB193\uACE0 \uC628 \uB4A4\uC600\uC5B4." }, { "who": "freddie", "text": "\uADF8\uB798\uC11C \uB098\uB354\uB7EC \uCC3E\uC544\uC624\uB77C\uB294 \uB9D0\uC740 \uD55C \uBC88\uB3C4 \uC548 \uD588\uAD6C\uB098.", "face": "\uAE30\uBCF8" }, { "who": "varun", "text": "\u2026\u2026\uC2A4\uC988\uB124\uD55C\uD14C \uD55C \uB9D0\uB3C4 \uBBF8\uB07C\uC600\uC5B4?", "face": "\uC9C4\uC9C0" }, { "who": "me", "text": "\uB098\uB294 \uADF8\uB807\uAC8C \uBD10. \uBC14\uB8EC, \uB10C \uC804\uB9DD \uBC14\uC704 \uC598\uAE30\uB97C \uB4E4\uC5C8\uC744 \uB54C \uC5B4\uB5BB\uAC8C \uBC1B\uC544\uB4E4\uC600\uC5B4?" }] }, { "type": "trans", "issue": "i4", "text": "\uC7C1\uC810 \uB137" }, { "type": "talk", "issue": "i4", "lines": [{ "who": "varun", "text": "\uB204\uAC00 \uAC70\uAE30\uB2E4 \uBE7C\uB480\uB2E4\uACE0 \uC0DD\uAC01\uD588\uB2E4. \uC790\uAE30 \uC804\uC9C0\uB294 \uB530\uB85C \uBC1B\uACE0, \uB0A8\uB4E4 \uBAAB\uAE4C\uC9C0.", "face": "\uC9C4\uC9C0" }, { "who": "me", "text": "\uADF8\uB54C\uBD80\uD130 \uC800\uC2A4\uD2F4\uC744 \uC758\uC2EC\uD55C \uAC70\uC57C?" }, { "who": "varun", "text": "\uC2A4\uC988\uB124\uD55C\uD150 \uBD24\uB2E4\uACE0 \uD588\uC9C0. \uC790\uAE30\uAC00 \uB1A8\uB2E4\uACE0 \uD55C \uC801\uC740 \uC5C6\uB2E4. \uB09C \uAC00\uC9C0\uB7EC \uC62C \uC0AC\uB78C\uC744 \uAE30\uB2E4\uB838\uB2E4.", "face": "\uAE30\uBCF8" }, { "who": "suzune", "text": "\uB85C\uBE44\uB97C \uB098\uC640\uC11C \uC81C\uAC00 \uBA3C\uC800 \uC774\uC57C\uAE30\uD588\uC5B4\uC694. \uBC14\uB8EC \uC528\uD558\uACE0 \uAC19\uC774 \uB2E4\uB2C8\uB294\uB370, \uC800\uB9CC \uC54C\uACE0 \uC788\uB294 \uAC8C \uC774\uC0C1\uD55C \uAC83 \uAC19\uC544\uC11C\uC694.", "face": "\uACE4\uB780" }, { "who": "seoha", "text": "\uAC00\uC838\uAC00\uBA74 \uC8FC\uBAA8\uC790\uB2E4? \uADF8\uCABD\uC740 \uADF8\uB807\uAC8C \uC0DD\uAC01\uD588\uC5B4?", "face": "\uC758\uC2EC" }, { "who": "varun", "text": "\uADF8\uB550 \uADF8\uB7AC\uB2E4. \uB2E4\uB4E4 \uC790\uAE30 \uBAAB\uB9CC \uC4F0\uC790\uACE0 \uD55C \uB2E4\uC74C \uB0A0\uC774\uC5C8\uC73C\uB2C8\uAE4C.", "face": "\uC9C4\uC9C0" }, { "who": "me", "text": "\uADF8\uB7FC \uC65C \uC804\uC9C0 \uC606\uC5D0\uC11C \uAE30\uB2E4\uB9AC\uC9C0 \uC54A\uC558\uC5B4?" }, { "who": "varun", "text": "\uC704\uC5D0 \uB0B4\uAC00 \uC11C \uC788\uC73C\uBA74 \uB3CC\uC544\uC11C\uACA0\uC9C0. \uBCA4\uCE58\uC5D0\uC120 \uBE44\uD0C8 \uC785\uAD6C\uAC00 \uBCF4\uC600\uB2E4. \uC804\uC9C0\uB97C \uB4E4\uACE0 \uB0B4\uB824\uC624\uBA74 \uC544\uB798\uC5D0\uC11C \uC138\uC6B8 \uC0DD\uAC01\uC774\uC5C8\uB2E4.", "face": "\uAE30\uBCF8" }, { "who": "me", "text": "\uC138\uC6CC\uC11C \uBB50\uB77C\uACE0 \uD558\uB824\uACE0?" }, { "who": "varun", "text": "\uC65C \uB354 \uD544\uC694\uD588\uB0D0\uACE0. \uADF8 \uB300\uB2F5\uBD80\uD130 \uB4E4\uC73C\uB824\uACE0 \uD588\uB2E4.", "face": "\uC9C4\uC9C0" }, { "who": "suzune", "text": "\uBC14\uB8EC \uC528\uAC00 \uC800\uB141 \uBA39\uC73C\uB7EC \uAC00\uC790\uACE0 \uD560 \uB54C\uAE4C\uC9C0 \uC804 \uC606\uC5D0\uC11C \uADF8\uB838\uC5B4\uC694. \uC885\uC774\uC5D0\uC11C \uB208\uC744 \uB4E4\uBA74 \uBC14\uB8EC \uC528\uB294 \uC5EC\uC804\uD788 \uAC19\uC740 \uCABD\uC744 \uBCF4\uACE0 \uC788\uC5C8\uC5B4\uC694.", "face": " /* \uBC18\uB860 \uCEF7\uC778: \uB9D0\uD558\uB294 \uB3C4\uC911\uC5D0 \uB04A\uACE0 \uB4E4\uC5B4\uC628\uB2E4 */
.tr-objc{position:absolute;inset:0;z-index:3;pointer-events:none}
.tr-objc-dim{position:absolute;inset:0;background:#000;animation:trobjdim 1.15s both}
.tr-objc-band{position:absolute;left:-20px;right:-20px;top:110px;height:170px;background:#08070d;transform:skewY(-9deg);overflow:hidden;border-top:3px solid #fff;border-bottom:3px solid #c0504a;animation:trobjband 1.15s cubic-bezier(.15,.9,.25,1) both}
.tr-objc-band>i{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:trobjline .6s .1s ease-out both}
.tr-objc-band>i.s1{left:0;width:70%;top:26px}.tr-objc-band>i.s2{right:0;width:60%;bottom:30px;animation-delay:.2s}
.tr-objc-face{position:absolute;left:10px;top:-10px;width:220px;height:200px;overflow:hidden;transform:skewY(9deg);-webkit-mask-image:linear-gradient(90deg,#000 65%,transparent);mask-image:linear-gradient(90deg,#000 65%,transparent);animation:trobjface 1.15s ease-out both}
.tr-objc-word{position:absolute;right:22px;top:300px;transform:rotate(-6deg);font-size:46px;font-weight:900;color:#fff;letter-spacing:2px;-webkit-text-stroke:2px #c0504a;text-shadow:4px 4px 0 #c0504a;animation:trobjword 1.15s cubic-bezier(.2,1.6,.4,1) both}
.tr-objc-name{position:absolute;right:30px;top:360px;font-size:12px;color:#ffd0c8;letter-spacing:2px;animation:trobjword 1.15s both}
@keyframes trobjdim{0%{opacity:0}15%,80%{opacity:.55}100%{opacity:0}}
@keyframes trobjband{0%{transform:skewY(-9deg) translateX(-110%)}18%,82%{transform:skewY(-9deg) translateX(0)}100%{transform:skewY(-9deg) translateX(110%)}}
@keyframes trobjline{from{transform:translateX(-100%);opacity:0}to{transform:translateX(30%);opacity:1}}
@keyframes trobjface{0%{transform:skewY(9deg) translateX(-30px)}25%,100%{transform:skewY(9deg) translateX(0)}}
@keyframes trobjword{0%,12%{opacity:0;transform:rotate(-6deg) scale(2.4)}30%{opacity:1;transform:rotate(-6deg) scale(1)}85%{opacity:1}100%{opacity:0}}
/* \uAE30\uC5B5 \uD604\uC0C1: \uC554\uC2E4 */
.tr-dv-head{display:grid;gap:1px;text-align:center}.tr-dv-head b{font-size:13px;color:#f2d79e;letter-spacing:1px}.tr-dv-head span{font-size:11px;color:#b9ad96}

.tr-objc-cut{position:absolute;left:-40px;top:96px;width:409px;height:238px;animation:trobjcut 1.15s cubic-bezier(.15,.9,.25,1) both}

@keyframes trobjcut{0%{transform:translateX(-105%);opacity:1}16%,84%{transform:translateX(0);opacity:1}100%{transform:translateX(105%);opacity:0}}
.tr-ns-mag{scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:24px}.tr-ns-mag::-webkit-scrollbar{display:none}
/* \uAFC8 \uC870\uAC01 \uC787\uAE30 */

.tr-dr-speed{position:absolute;left:-30px;top:110px;width:40px;height:60px;background:repeating-linear-gradient(0deg,transparent 0 8px,#ffffff88 8px 10px);opacity:.7}

.tr-dr-cut{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.tr-dr-cut line{stroke:#e6dcff;stroke-width:.8;filter:drop-shadow(0 0 2px #b9a2ff);vector-effect:non-scaling-stroke}

.tr-dr-row{display:grid;grid-template-columns:88px 30px 1fr 30px;align-items:center;gap:5px;font-size:12px;color:#c9bfe0}

.tr-ns-missbox{position:absolute;left:0;right:0;bottom:0;min-height:96px;cursor:pointer;animation:trnsin .18s}
.tr-ttext.mono{color:#8fd8ff}

.tr-shade{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mix-blend-mode:multiply}
.tr-dbgbox{display:grid;gap:4px;border:1px dashed #6a5a8a;border-radius:8px;padding:6px}

.tr-devhead{font-size:13px}.tr-devwarn{font-size:12px;color:#ffb3a8;background:#3a1414aa;border:1px solid #ff5a4a66;border-radius:6px;padding:4px 6px}

.tr-batrow{position:absolute;right:4px;top:34px;z-index:5;display:flex}.tr-batrow .tr-bat{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;white-space:nowrap;cursor:pointer;font-size:11px;background:#0e1624e0;border:1px solid #e9c98c55;border-radius:999px;color:#f3ead6}
